# advisor.conf - Carbon 자문 키트 설정
# 훅 스크립트가 시작할 때 읽는다. 같은 이름의 환경 변수가 있으면 환경 변수가 우선한다.

# 자문 서브에이전트 이름 (.agents/agents/<이름>/agent.md 의 name 과 같아야 한다)
ADVISOR_AGENT_NAME="${ADVISOR_AGENT_NAME:-carbon-advisor}"

# 리드 세션 판별: 훅 입력의 modelName 이 이 정규식에 맞을 때만 트리거가 동작한다(대소문자 무시).
# 하위 에이전트(Hydrogen)나 자문(Carbon) 세션에서 트리거가 돌지 않게 하는 장치다.
#   리드가 Argon:           argon
#   리드가 Carbon:          carbon   (이 경우 자문과 구분되지 않으니 주의)
#   모든 세션에 적용:       .
ADVISOR_LEAD_MODEL_REGEX="${ADVISOR_LEAD_MODEL_REGEX:-argon}"

# 트리거 1: 계획 확정 전 (요청당 첫 파일 수정을 한 번 막고 안내)
#   auto   = Decision 1 을 쓸 수 있으면 판정에 따르고, 못 쓰면 항상 안내
#   always = 항상 안내 (Decision 1 호출 안 함)
#   off    = 끔
ADVISOR_PLAN_GATE="${ADVISOR_PLAN_GATE:-auto}"

# 트리거 2: 같은 오류 N회 (같은 도구, 같은 대상, 같은 오류 문자열이 연속 N회)
ADVISOR_SAME_ERROR_THRESHOLD="${ADVISOR_SAME_ERROR_THRESHOLD:-2}"

# 트리거 3: 완료 전 (파일을 수정한 요청에서만, auto | always | off)
ADVISOR_STOP_REVIEW="${ADVISOR_STOP_REVIEW:-auto}"
# 한 요청에서 완료 전 검토를 요구하는 최대 횟수 (무한 반복 방지)
ADVISOR_MAX_STOP_REVIEWS="${ADVISOR_MAX_STOP_REVIEWS:-2}"

# Decision 1 (Gemini Decisions API)
#   auto = 키가 있으면 사용, off = 사용 안 함
#   키는 환경 변수 ADVISOR_DECISIONS_API_KEY 또는 아래 파일에서 읽는다.
#   GEMINI_API_KEY 를 일부러 쓰지 않는다. agy 와 대시보드가 그 변수를 모델 호출 경로 선택에 쓸 수 있기 때문이다.
ADVISOR_DECISION="${ADVISOR_DECISION:-auto}"
ADVISOR_DECISIONS_KEY_FILE="${ADVISOR_DECISIONS_KEY_FILE:-$HOME/.config/advisor-kit/decisions.key}"
# 확신도(confidence)가 이 값 이상이면 sharp(코드가 결정), 미만이면 split(리드가 판단)
# 0.70 은 화면과 맞춘 시작값이다. 실제 판정 기록(state/decisions.jsonl)을 보고 조정할 것.
ADVISOR_CONF_THRESHOLD="${ADVISOR_CONF_THRESHOLD:-0.70}"
ADVISOR_DECISION_TIMEOUT="${ADVISOR_DECISION_TIMEOUT:-4}"

# 자문에게 넘기는 대화 기록 사본의 최대 크기(KB). 클수록 자문이 읽는 토큰이 늘어난다.
ADVISOR_TRANSCRIPT_TAIL_KB="${ADVISOR_TRANSCRIPT_TAIL_KB:-256}"

# 세션 시작 때 리드에게 자문 사용법을 한 번 알려 줄지 (on | off)
ADVISOR_SESSION_BRIEF="${ADVISOR_SESSION_BRIEF:-on}"
